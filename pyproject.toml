[project]
name = "askmydocs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Florian", email = "94357651+Flyrik@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
]

[project.scripts]
askmydocs = "askmydocs:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
